<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <title></title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="page page-contact" data-page="contact">

  <a class="skip-link" href="#main-content"></a>
  <div data-component="header"></div>

  <main id="main-content">

    <section class="page-hero" aria-labelledby="page-title">
      <div class="container">
        <div class="page-hero__breadcrumb-placeholder" aria-hidden="true"></div>
        <h1 id="page-title" class="page-hero__title-placeholder" aria-hidden="true"></h1>
      </div>
    </section>

    <section class="section" aria-label="">
      <div class="container contact__layout">
        <!-- Contact form skeleton -->
        <div>
          <form class="form" action="#" method="post" novalidate>
            <div class="form__group">
              <div class="form__label-placeholder" aria-hidden="true"></div>
              <div class="form__input-placeholder" role="presentation" aria-hidden="true"></div>
            </div>
            <div class="form__group">
              <div class="form__label-placeholder" aria-hidden="true"></div>
              <div class="form__input-placeholder" role="presentation" aria-hidden="true"></div>
            </div>
            <div class="form__group">
              <div class="form__label-placeholder" aria-hidden="true"></div>
              <div class="form__input-placeholder" role="presentation" aria-hidden="true"></div>
            </div>
            <div class="form__group">
              <div class="form__label-placeholder" aria-hidden="true"></div>
              <div class="form__textarea-placeholder" role="presentation" aria-hidden="true"></div>
            </div>
            <div class="form__submit-placeholder" role="presentation" aria-hidden="true"></div>
          </form>
        </div>
        <!-- Map / office info placeholder -->
        <aside aria-label="">
          <div class="contact__map-placeholder" role="presentation" aria-hidden="true"></div>
          <div class="stack stack--lg">
            <div class="content-block__title-placeholder" aria-hidden="true"></div>
            <div class="content-block__paragraph-placeholder" aria-hidden="true"></div>
            <div class="content-block__paragraph-placeholder" aria-hidden="true"></div>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <div data-component="footer"></div>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
