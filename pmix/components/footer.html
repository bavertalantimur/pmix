<!--
  PMGIX — Footer Component
  Injected via main.js into [data-component="footer"]
-->
<footer class="footer" role="contentinfo">
  <div class="container">
    <div class="grid grid--footer">
      <!-- Column 1: Brand -->
      <div class="footer__column footer__column--brand">
        <div class="footer__brand-placeholder" aria-hidden="true"></div>
        <div class="footer__link-placeholder" aria-hidden="true"></div>
        <div class="footer__link-placeholder" aria-hidden="true"></div>
      </div>

      <!-- Column 2: Links group -->
      <div class="footer__column">
        <div class="footer__column-title-placeholder" aria-hidden="true"></div>
        <ul class="footer__link-list" role="list">
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
        </ul>
      </div>

      <!-- Column 3: Links group -->
      <div class="footer__column">
        <div class="footer__column-title-placeholder" aria-hidden="true"></div>
        <ul class="footer__link-list" role="list">
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
        </ul>
      </div>

      <!-- Column 4: Links group -->
      <div class="footer__column">
        <div class="footer__column-title-placeholder" aria-hidden="true"></div>
        <ul class="footer__link-list" role="list">
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
          <li><span class="footer__link-placeholder" aria-hidden="true"></span></li>
        </ul>
      </div>
    </div>

    <!-- Footer bottom bar -->
    <div class="footer__bottom flex flex--between flex--wrap flex--gap-md">
      <div class="footer__copyright-placeholder" aria-hidden="true"></div>
      <div class="footer__link-placeholder" aria-hidden="true"></div>
    </div>
  </div>
</footer>
